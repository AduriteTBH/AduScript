<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube - AduScript Next-Gen Edition</title>
  <meta name="description" content="A complete YouTube clone built 100% in AduScript (.ads), CSS, and HTML with zero JavaScript application code.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- External Stylesheets -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/layout.css">
  
  <!-- Standalone AduScript Engine (Local repo build with instant CDN fallback) -->
  <script src="../../dist/aduscript-browser.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/gh/AduriteTBH/AduScript@main/dist/aduscript-browser.js';"></script>
</head>
<body>
  <!-- Root Container for AduScript App Mount -->
  <div id="app-root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f0f0f;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;flex-direction:column;gap:16px;">
      <div style="width:48px;height:48px;border:3px solid rgba(255,0,51,0.3);border-top-color:#ff0033;border-radius:50%;animation:spin 1s linear infinite;"></div>
      <div style="font-size:16px;font-weight:700;letter-spacing:0.5px;">Loading AduScript YouTube App...</div>
    </div>
  </div>

  <!-- Pure AduScript Application -->
  <script type="text/aduscript">
    // 1. Dataset
    let VIDEO_DATASET = [
      {
        id: "v1",
        title: "🪐 Building a 3D Galaxy Simulation from Scratch in AduScript",
        channel: "AduScript Devs",
        channelAvatar: "🪐",
        channelColor: "linear-gradient(135deg, #ec4899, #8b5cf6)",
        views: 185200,
        timestamp: "2 days ago",
        duration: 868,
        category: "3D WebGL",
        thumbnail: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=640&q=80",
        description: "Learn how to use AduScript with Three.js via zero-boilerplate CDN imports and fine-grained reactive state signals!"
      },
      {
        id: "v2",
        title: "⚡ How AduScript Replaces React, Vue, and Webpack in 2026",
        channel: "Frontend Mastery",
        channelAvatar: "⚡",
        channelColor: "linear-gradient(135deg, #f59e0b, #ef4444)",
        views: 340500,
        timestamp: "5 days ago",
        duration: 1085,
        category: "AduScript",
        thumbnail: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=640&q=80",
        description: "A comprehensive breakdown of AduScript pipeline operators, pattern matching, and built-in reactivity."
      },
      {
        id: "v3",
        title: "🎮 Building an Interactive Canvas Game with Pipeline Operators",
        channel: "GameDev Academy",
        channelAvatar: "🎮",
        channelColor: "linear-gradient(135deg, #10b981, #06b6d4)",
        views: 92400,
        timestamp: "1 week ago",
        duration: 1360,
        category: "Gaming",
        thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=640&q=80",
        description: "Watch how clean AduScript functional pipelines make game loop state updates and collisions."
      },
      {
        id: "v4",
        title: "🤖 Modern AI Agent Toolchains: The Complete Guide",
        channel: "Tech Tomorrow",
        channelAvatar: "🤖",
        channelColor: "linear-gradient(135deg, #8b5cf6, #3b82f6)",
        views: 520800,
        timestamp: "3 days ago",
        duration: 1872,
        category: "AI",
        thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=640&q=80",
        description: "Deep dive into next-generation intelligent coding agents and reactive compilers."
      }
    ]

    // 2. Reactive State Signals
    state activeNav = "home"
    state isSidebarCollapsed = false
    state searchQuery = ""
    state activeCategory = "All"
    state selectedVideo = null
    state isPlaying = true
    state isLiked = false
    state isSubscribed = false
    state activeComments = [
      { id: "c1", author: "Sarah Connor", avatar: "S", time: "1 day ago", text: "AduScript is shockingly fast! The zero-boilerplate CDN feature is amazing." },
      { id: "c2", author: "Alex Rivers", avatar: "A", time: "2 days ago", text: "The pipeline operator |> makes data filtering look so much cleaner than standard JS." }
    ]

    let CATEGORIES = ["All", "AduScript", "3D WebGL", "Gaming", "AI", "Music", "Podcasts"]

    // 3. Action Handlers
    fn handleSelectVideo(video) {
      selectedVideo.value = video
      isPlaying.value = true
      isLiked.value = false
      isSubscribed.value = false
      window.scrollTo({ top: 0, behavior: "smooth" })
    }

    fn handleBackToHome() {
      selectedVideo.value = null
    }

    fn handleToggleSidebar() {
      isSidebarCollapsed.value = !isSidebarCollapsed.value
    }

    fn handleAddComment(e) {
      if (e.key == "Enter" && e.target.value.trim()) {
        let newC = {
          id: f"c_{Date.now()}",
          author: "AduScript Developer",
          avatar: "A",
          time: "Just now",
          text: e.target.value.trim()
        }
        activeComments.value = [newC, ...activeComments.value]
        e.target.value = ""
      }
    }

    fn formatViews(num) {
      if (num >= 1000000) return f"{(num / 1000000).toFixed(1)}M views"
      if (num >= 1000) return f"{(num / 1000).toFixed(1)}K views"
      return f"{num} views"
    }

    fn formatDuration(sec) {
      let mins = Math.floor(sec / 60)
      let remSec = sec % 60
      let secStr = remSec < 10 ? f"0{remSec}" : f"{remSec}"
      return f"{mins}:{secStr}"
    }

    // 4. View Renderers
    fn renderNavbar() {
      return $adu.html`
        <header class="yt-navbar">
          <div class="yt-nav-left">
            <button class="yt-icon-btn" onclick=${handleToggleSidebar} title="Toggle Sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>

            <div class="yt-logo" onclick=${handleBackToHome} title="AduScript YouTube">
              ${$adu.logo(28)}
              <span class="yt-logo-text">AduTube</span>
              <span class="yt-logo-sub">ADS</span>
            </div>
          </div>

          <div class="yt-nav-center">
            <div class="yt-search-container">
              <input
                type="text"
                class="yt-search-input"
                placeholder="Search videos in AduScript..."
                value="${searchQuery.value}"
                oninput=${(e) -> { searchQuery.value = e.target.value }}
              />
              <button class="yt-search-btn" title="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="yt-nav-right">
            <div class="yt-avatar" title="AduScript User">A</div>
          </div>
        </header>
      `
    }

    fn renderSidebar() {
      let collapsedClass = isSidebarCollapsed.value ? "collapsed" : ""
      return $adu.html`
        <aside class="yt-sidebar ${collapsedClass}">
          <div class="sidebar-link ${activeNav.value == 'home' ? 'active' : ''}" onclick=${() -> { activeNav.value = 'home'; handleBackToHome() }}>
            <span style="font-size: 18px;">🏠</span>
            <span class="sidebar-label">Home</span>
          </div>
          <div class="sidebar-link ${activeNav.value == 'trending' ? 'active' : ''}" onclick=${() -> { activeNav.value = 'trending'; handleBackToHome() }}>
            <span style="font-size: 18px;">🔥</span>
            <span class="sidebar-label">Trending</span>
          </div>
          <div class="sidebar-link ${activeNav.value == 'library' ? 'active' : ''}" onclick=${() -> { activeNav.value = 'library'; handleBackToHome() }}>
            <span style="font-size: 18px;">📚</span>
            <span class="sidebar-label">Library</span>
          </div>
        </aside>
      `
    }

    fn renderFeed() {
      let filtered = VIDEO_DATASET.filter(v -> {
        let matchesCat = activeCategory.value == "All" || v.category == activeCategory.value
        let matchesSearch = searchQuery.value.trim().length == 0 || v.title.toLowerCase().includes(searchQuery.value.toLowerCase()) || v.channel.toLowerCase().includes(searchQuery.value.toLowerCase())
        return matchesCat && matchesSearch
      })

      let chips = CATEGORIES.map(cat -> $adu.html`
        <button class="chip-btn ${activeCategory.value == cat ? 'active' : ''}" onclick=${() -> activeCategory.value = cat}>
          ${cat}
        </button>
      `)

      let cards = filtered.map(v -> $adu.html`
        <div class="video-card" onclick=${() -> handleSelectVideo(v)}>
          <div class="video-thumbnail">
            <div class="thumbnail-content">
              <img src="${v.thumbnail}" alt="${v.title}" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;" />
            </div>
            <div class="time-badge">${formatDuration(v.duration)}</div>
          </div>
          <div class="video-details">
            <div class="channel-avatar" style="background: ${v.channelColor};">
              ${v.channelAvatar}
            </div>
            <div class="video-info">
              <h3 class="video-title" title="${v.title}">${v.title}</h3>
              <div class="channel-name">${v.channel}</div>
              <div class="video-metadata">${formatViews(v.views)} • ${v.timestamp}</div>
            </div>
          </div>
        </div>
      `)

      return $adu.html`
        <div class="yt-content-viewport">
          <div class="category-bar">${chips}</div>
          <div class="video-grid">${cards}</div>
        </div>
      `
    }

    fn renderWatch(video) {
      let commentsList = activeComments.value.map(c -> $adu.html`
        <div style="display: flex; gap: 14px; margin-bottom: 18px;">
          <div class="channel-avatar" style="background: var(--yt-red); width: 36px; height: 36px;">${c.avatar}</div>
          <div>
            <div style="font-size: 13px; font-weight: 700; color: #fff;">${c.author} <span style="font-size: 11px; color: #888; margin-left: 6px; font-weight: 400;">${c.time}</span></div>
            <div style="font-size: 14px; color: #ddd; margin-top: 4px; line-height: 1.4;">${c.text}</div>
          </div>
        </div>
      `)

      return $adu.html`
        <div class="yt-content-viewport">
          <div class="watch-page">
            <div class="player-container">
              <div class="video-screen">
                <div class="video-screen-inner" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #2b0c19 0%, #000 100%);">
                  ${$adu.logo(64)}
                  <h2 style="font-size: 20px; color: #fff; margin-top: 16px; text-align: center; max-width: 80%;">${video.title}</h2>
                  <div style="font-size: 13px; color: #38bdf8; margin-top: 8px;">⚡ Playing live in pure AduScript (.ads) runtime</div>
                </div>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 14px;">
                  <div class="channel-avatar" style="background: ${video.channelColor}; width: 44px; height: 44px; font-size: 18px;">${video.channelAvatar}</div>
                  <div>
                    <div style="font-weight: 700; font-size: 16px; color: #fff;">${video.channel}</div>
                    <div style="font-size: 12px; color: #aaa;">1.2M subscribers</div>
                  </div>
                  <button class="chip-btn ${isSubscribed.value ? 'active' : ''}" style="margin-left: 12px; border-radius: 20px; padding: 8px 18px;" onclick=${() -> isSubscribed.value = !isSubscribed.value}>
                    ${isSubscribed.value ? '✓ Subscribed' : 'Subscribe'}
                  </button>
                </div>

                <div style="display: flex; gap: 10px;">
                  <button class="chip-btn" style="border-radius: 20px; display: flex; align-items: center; gap: 6px; padding: 8px 16px;" onclick=${() -> isLiked.value = !isLiked.value}>
                    ${isLiked.value ? '❤️ Liked' : '🤍 Like'}
                  </button>
                  <button class="chip-btn" style="border-radius: 20px; padding: 8px 16px;" onclick=${handleBackToHome}>
                    ✕ Back to Feed
                  </button>
                </div>
              </div>

              <div style="background: var(--yt-bg-elevated); border-radius: 12px; padding: 18px; margin-top: 16px; font-size: 14px; line-height: 1.5; border: 1px solid var(--yt-border-subtle);">
                <div style="font-weight: 700; color: #fff; margin-bottom: 6px;">${formatViews(video.views)} • Uploaded ${video.timestamp}</div>
                <div style="color: #ddd;">${video.description}</div>
              </div>

              <div style="margin-top: 28px;">
                <h3 style="font-size: 17px; margin-bottom: 16px;">${activeComments.value.length} Comments</h3>
                <div style="display: flex; gap: 14px; margin-bottom: 24px;">
                  <div class="channel-avatar" style="background: var(--yt-red); width: 36px; height: 36px;">A</div>
                  <input class="yt-search-input" style="flex: 1; border-bottom: 1px solid var(--yt-border); border-radius: 0; padding: 6px 0;" placeholder="Add a public comment (Press Enter to post)..." onkeydown=${handleAddComment} />
                </div>
                <div>${commentsList}</div>
              </div>
            </div>

            <!-- Recommendations Sidebar -->
            <div style="display: flex; flex-direction: column; gap: 16px;">
              <h4 style="font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px;">Up Next</h4>
              ${VIDEO_DATASET.filter(v -> v.id != video.id).map(rec -> $adu.html`
                <div class="video-card" style="display: flex; flex-direction: row; gap: 10px;" onclick=${() -> handleSelectVideo(rec)}>
                  <div style="width: 140px; aspect-ratio: 16/9; position: relative; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #202020;">
                    <img src="${rec.thumbnail}" style="width: 100%; height: 100%; object-fit: cover;" />
                    <div class="time-badge">${formatDuration(rec.duration)}</div>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div style="font-size: 13px; font-weight: 600; color: #fff; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${rec.title}</div>
                    <div style="font-size: 11px; color: #aaa;">${rec.channel}</div>
                    <div style="font-size: 11px; color: #888;">${formatViews(rec.views)}</div>
                  </div>
                </div>
              `)}
            </div>
          </div>
        </div>
      `
    }

    // 5. Main App
    fn App() {
      let navbar = renderNavbar()
      let sidebar = renderSidebar()
      let content = match selectedVideo.value with {
        null => renderFeed(),
        _    => renderWatch(selectedVideo.value)
      }

      return $adu.html`
        <div class="app-root">
          ${navbar}
          <div class="yt-main-layout">
            ${sidebar}
            ${content}
          </div>
        </div>
      `
    }

    $adu.mount("#app-root", App)
    console.log("✔ AduScript YouTube Clone Mounted Successfully!")
  </script>
</body>
</html>
